<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jess L McPeak — Portfolio</title>

    <!--
      Google Fonts — loads the two typefaces used across the site:
        Fraunces  — high-contrast optical serif for all headings
        Space Grotesk — geometric sans-serif for body copy and UI
      The `ital,opsz,wght` axes unlock italic, optical size, and weight
      variations within each font without a separate request.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      React mounts into this div. Everything you see on screen is
      rendered by React inside here — the HTML file itself stays empty.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
